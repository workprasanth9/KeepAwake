name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build universal binary
        run: ./Scripts/build-universal.sh

      - name: Package menu bar app
        run: ./Scripts/package-menu-app.sh

      - name: Build installer package
        run: ./Scripts/build-pkg.sh

      - name: Archive and checksum
        run: |
          cd dist
          chmod 755 keepawake
          tar -czf keepawake-macos-universal.tar.gz keepawake
          ditto -c -k --keepParent KeepAwake.app KeepAwake-menu.zip
          shasum -a 256 keepawake keepawake-macos-universal.tar.gz KeepAwake-menu.zip keepawake-cli.pkg > keepawake.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/keepawake \
            dist/keepawake-macos-universal.tar.gz \
            dist/KeepAwake-menu.zip \
            dist/keepawake-cli.pkg \
            dist/keepawake.sha256 \
            --title "KeepAwake ${{ github.ref_name }}" \
            --notes "Universal macOS build of KeepAwake ${{ github.ref_name }}. The command line binary, menu bar app, and unsigned installer package are attached. See CHANGELOG.md. Sign the package before a production Jamf rollout."
