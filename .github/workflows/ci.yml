name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Reject em dashes
        run: ./Scripts/check-text.sh

      - name: Test
        run: swift test

      - name: Smoke test the command
        run: |
          swift run keepawake --help
          swift run keepawake start --help
          swift run keepawake install --help
          swift run keepawake schedule "Mon-Fri 09:00-17:00"
          swift run keepawake start --duration 1h --dry-run
          swift run keepawake config

      - name: Build universal binary
        run: ./Scripts/build-universal.sh

      - name: Confirm architectures
        run: |
          lipo -info dist/keepawake | tee /tmp/keepawake-lipo.txt
          grep -q arm64 /tmp/keepawake-lipo.txt
          grep -q x86_64 /tmp/keepawake-lipo.txt
          dist/keepawake --version
          dist/keepawake schedule "Mon-Fri 08:00-18:00"

      - name: Build release artifacts
        run: |
          ./Scripts/build-release.sh
          lipo -info dist/KeepAwake.app/Contents/MacOS/KeepAwake
          lipo -info dist/KeepAwake.app/Contents/Resources/keepawake
          pkgutil --payload-files dist/KeepAwake-*.pkg | grep -E 'KeepAwake.app$|keepawake$'

      - uses: actions/upload-artifact@v4
        with:
          name: keepawake-macos-universal
          path: |
            dist/keepawake-*-macos-universal.zip
            dist/KeepAwake-*-app.zip
            dist/KeepAwake-*.pkg
            dist/keepawake-cli-*.pkg
            dist/keepawake-*.sha256
